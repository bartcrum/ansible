---
# =============================================================================
# POST-VALIDATION PLAYBOOK
# =============================================================================
# Run AFTER making changes. Captures new state, compares to pre-validation
# baseline, and generates the audit report.
# AWX Workflow Node 3 — triggers after the change playbook.
#
# Usage (CLI):
#   ansible-playbook playbooks/post_validate.yml \
#     -i inventories/production/hosts.yml \
#     -e change_ticket=CHG0012345 \
#     -e validation_output_dir=/tmp/network_validation/<timestamp>
#
# Extra vars:
#   expected_changes: ["bgp_summary", "route_summary"]   # optional allow-list
#   fail_on_drift: true                                    # fail on unexpected changes
# =============================================================================

# --- Common setup ---
- name: "Post-Validation — Setup"
  hosts: localhost
  gather_facts: true
  roles:
    - role: validate_common
      validation_phase: "post"

# --- Arista EOS ---
- name: "Post-Validation — Arista EOS"
  hosts: arista
  gather_facts: false
  roles:
    - role: validate_arista
      validation_phase: "post"

# --- Cisco ACI ---
- name: "Post-Validation — Cisco ACI"
  hosts: cisco_aci
  gather_facts: false
  roles:
    - role: validate_cisco_aci
      validation_phase: "post"

# --- Cisco Catalyst ---
- name: "Post-Validation — Cisco Catalyst"
  hosts: cisco_catalyst
  gather_facts: false
  roles:
    - role: validate_cisco_catalyst
      validation_phase: "post"

# --- NSX (read-only visibility) ---
- name: "Post-Validation — NSX (Read-Only)"
  hosts: nsx
  gather_facts: false
  roles:
    - role: validate_nsx
      validation_phase: "post"

# --- Compare pre vs post for all hosts ---
- name: "Post-Validation — Compare & Diff"
  hosts: network_all
  gather_facts: false
  tasks:
    - name: "Run comparison"
      ansible.builtin.include_role:
        name: validate_common
        tasks_from: compare

# --- Generate audit report ---
- name: "Post-Validation — Generate Report"
  hosts: localhost
  gather_facts: true
  tasks:
    - name: "Collect all diff files"
      ansible.builtin.find:
        paths: "{{ snapshot_dir }}"
        patterns: "diff_*.json"
      register: diff_files

    - name: "Load all diffs into single structure"
      ansible.builtin.set_fact:
        all_diffs: "{{ all_diffs | default([]) + [lookup('file', item.path) | from_json] }}"
      loop: "{{ diff_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: "Load pre and post metadata"
      ansible.builtin.set_fact:
        pre_metadata: "{{ lookup('file', snapshot_dir + '/pre_metadata.json') | from_json }}"
        post_metadata: "{{ lookup('file', snapshot_dir + '/post_metadata.json') | from_json }}"

    - name: "Generate JSON report"
      ansible.builtin.copy:
        content: |
          {{ {
            'report_type': 'Network Change Validation',
            'change_ticket': change_ticket,
            'pre_validation': pre_metadata,
            'post_validation': post_metadata,
            'results': all_diffs,
            'summary': {
              'total_hosts': all_diffs | length,
              'hosts_with_changes': all_diffs | selectattr('diffs') | map(attribute='diffs') | map('selectattr', 'status', 'eq', 'CHANGED') | map('list') | select('length') | list | length,
              'total_checks': all_diffs | map(attribute='diffs') | map('length') | sum,
              'changed_checks': all_diffs | map(attribute='diffs') | map('selectattr', 'status', 'eq', 'CHANGED') | map('list') | map('length') | sum,
              'unchanged_checks': all_diffs | map(attribute='diffs') | map('selectattr', 'status', 'eq', 'UNCHANGED') | map('list') | map('length') | sum
            }
          } | to_nice_json }}
        dest: "{{ report_dir }}/validation_report_{{ change_ticket }}.json"
        mode: "0644"
      when: report_format in ['json', 'both']

    - name: "Generate HTML audit report"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/validation_report.html.j2"
        dest: "{{ report_dir }}/validation_report_{{ change_ticket }}.html"
        mode: "0644"
      vars:
        report_data:
          change_ticket: "{{ change_ticket }}"
          pre_metadata: "{{ pre_metadata }}"
          post_metadata: "{{ post_metadata }}"
          results: "{{ all_diffs }}"
      when: report_format in ['html', 'both']

    - name: "Report generation complete"
      ansible.builtin.debug:
        msg: |
          ========================================
          VALIDATION REPORT COMPLETE
          ========================================
          Change Ticket: {{ change_ticket }}
          Report Dir:    {{ report_dir }}
          JSON Report:   {{ report_dir }}/validation_report_{{ change_ticket }}.json
          HTML Report:   {{ report_dir }}/validation_report_{{ change_ticket }}.html
          ========================================
