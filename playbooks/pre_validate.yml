---
# =============================================================================
# PRE-VALIDATION PLAYBOOK
# =============================================================================
# Run BEFORE making changes. Captures baseline state of all platforms.
# AWX Workflow Node 1 — triggers before the change playbook.
#
# Usage (CLI):
#   ansible-playbook playbooks/pre_validate.yml \
#     -i inventories/production/hosts.yml \
#     -e change_ticket=CHG0012345
#
# Usage (AWX):
#   Set as first node in workflow template. Pass change_ticket via
#   extra_vars or survey.
# =============================================================================

# --- Common setup (create dirs, record metadata) ---
- name: "Pre-Validation — Setup"
  hosts: localhost
  gather_facts: true
  roles:
    - role: validate_common
      validation_phase: "pre"

# --- Arista EOS ---
- name: "Pre-Validation — Arista EOS"
  hosts: arista
  gather_facts: false
  roles:
    - role: validate_arista
      validation_phase: "pre"

# --- Cisco ACI ---
- name: "Pre-Validation — Cisco ACI"
  hosts: cisco_aci
  gather_facts: false
  roles:
    - role: validate_cisco_aci
      validation_phase: "pre"

# --- Cisco Catalyst ---
- name: "Pre-Validation — Cisco Catalyst"
  hosts: cisco_catalyst
  gather_facts: false
  roles:
    - role: validate_cisco_catalyst
      validation_phase: "pre"

# --- NSX (read-only visibility) ---
- name: "Pre-Validation — NSX (Read-Only)"
  hosts: nsx
  gather_facts: false
  roles:
    - role: validate_nsx
      validation_phase: "pre"

# --- Summary ---
- name: "Pre-Validation — Complete"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Pre-validation snapshot complete"
      ansible.builtin.debug:
        msg: |
          ✓ Pre-validation snapshots saved to: {{ snapshot_dir }}
          ✓ Change ticket: {{ change_ticket }}
          ✓ Proceed with your change playbook, then run post_validate.yml
