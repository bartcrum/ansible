---
# =============================================================================
# Network Validation - Production Inventory
# =============================================================================
# Organize hosts by platform. AWX can also source this dynamically from
# a credential-backed inventory (ServiceNow CMDB, NetBox, etc.).
# =============================================================================

all:
  children:
    # -----------------------------------------------------------------
    # Arista EOS switches (managed via eAPI / network_cli)
    # -----------------------------------------------------------------
    arista:
      hosts:
        # Example - replace with real hostnames / IPs
        arista-spine-01:
          ansible_host: 10.1.1.1
        arista-spine-02:
          ansible_host: 10.1.1.2
        arista-leaf-01:
          ansible_host: 10.1.2.1
        arista-leaf-02:
          ansible_host: 10.1.2.2

    # -----------------------------------------------------------------
    # Cisco ACI fabric (managed via aci_rest / aci modules → APIC)
    # -----------------------------------------------------------------
    cisco_aci:
      hosts:
        aci-apic-01:
          ansible_host: 10.2.1.1
        aci-apic-02:
          ansible_host: 10.2.1.2

    # -----------------------------------------------------------------
    # Cisco Catalyst IOS/IOS-XE switches & routers (edge routing)
    # -----------------------------------------------------------------
    cisco_catalyst:
      hosts:
        cat-edge-rtr-01:
          ansible_host: 10.3.1.1
        cat-edge-rtr-02:
          ansible_host: 10.3.1.2
        cat-dist-sw-01:
          ansible_host: 10.3.2.1
        cat-dist-sw-02:
          ansible_host: 10.3.2.2
        cat-access-sw-01:
          ansible_host: 10.3.3.1

    # -----------------------------------------------------------------
    # VMware NSX (managed via NSX-T REST API → manager nodes)
    # NSX is not managed by the networking team, so these validations
    # are READ-ONLY health/state checks for visibility.
    # -----------------------------------------------------------------
    nsx:
      hosts:
        nsx-manager-01:
          ansible_host: 10.4.1.1

    # -----------------------------------------------------------------
    # Convenience groupings for workflow targeting
    # -----------------------------------------------------------------
    network_managed:
      children:
        arista:
        cisco_aci:
        cisco_catalyst:

    network_all:
      children:
        network_managed:
        nsx:
